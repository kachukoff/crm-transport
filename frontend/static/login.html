<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход - CRM Транспорт</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  
  <div class="login-page">
    <div class="login-card">

      <div class="login-card__logo">
        <span class="login-card__logo-mark">T</span>
        <span>CRM Транспорт</span>
      </div>

      <h1 class="login-card__title">Вход в систему</h1>
      <p class="login-card__subtitle">Введите свои учетные данные</p>

      <form class="login-card__form" action="#" method="post">

        <div class="form-group">
          <label class="form-group__label" for="email">Почта</label>
          <input 
            class="input"
            type="email"
            id="email"
            name="email"
            placeholder="name@company.ru"
            required
            autocomplete="email" 
          >
        </div>
        <div class="form-group">
          <label class="form-group__label" for="email">Пароль</label>
          <input 
            class="input"
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            required
            autocomplete="current-password" 
          >
        </div>
        
        <button type="submit" class="btn btn--primary btn--lg btn--block mt-4">
          Войти
        </button>

      </form>

      <div class="login-card__footer">
        Нет аккаунта? <a href="order-request.html">Оставить заявку на перевозку</a>
      </div>

    </div>
  </div>

  <div class="login-page__copyright">
    © 2026 CRM Транспорт. Дипломный проект.
  </div>

</body>
</html>
